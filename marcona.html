<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9ecce6" />
    <title>Marcona 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.13/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/artoolkit5-js@0.3.2/dist/ARToolkit.js"></script>
    <script src="nyar4p5.js"></script>
    <style>
      :root {
        --papel: rgba(255, 251, 244, .94);
        --tinta: #2a211a;
        --suave: #6f6257;
        --linea: rgba(42, 33, 26, .1);
        --acento: #e9822f;
        --acento-claro: #fde6cf;
        --sombra: 0 12px 32px rgba(20, 30, 40, .28), 0 2px 6px rgba(20, 30, 40, .12);
        --sans: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        --serif: "Fraunces", Georgia, serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9ecce6; color: var(--tinta);
        font: 15px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      canvas { touch-action: none; }
      button { font-family: var(--sans); }

      /* atmósfera: viñeta suave + bruma cálida (solo CSS, no cuesta nada al dibujo 3D) */
      #atmos { position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(20, 30, 45, .28) 100%),
          linear-gradient(to bottom, rgba(120, 175, 225, .22), transparent 30%, transparent 70%, rgba(255, 196, 140, .14)); }
      body.ra #atmos { background: radial-gradient(120% 90% at 50% 45%, transparent 60%, rgba(0, 0, 0, .3) 100%); }

      /* ---------- barra superior ---------- */
      #top { position: fixed; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none;
        padding: calc(env(safe-area-inset-top) + 10px) 16px 0; }
      .fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .vidrio { background: rgba(255, 251, 244, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, .7); box-shadow: 0 4px 14px rgba(20, 30, 40, .14); }
      #estado { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; max-width: 100%;
        padding: 6px 12px; border-radius: 999px; transition: opacity .4s, transform .4s; }
      #estado.oculto { opacity: 0; transform: translateY(-6px); }
      #estado span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #f1c40f; flex: none; box-shadow: 0 0 0 3px rgba(241, 196, 15, .25); }
      .dot.ok { background: #2ecc71; box-shadow: 0 0 0 3px rgba(46, 204, 113, .25); }
      .dot.error { background: #e74c3c; box-shadow: 0 0 0 3px rgba(231, 76, 60, .25); }
      .btn { pointer-events: auto; color: var(--tinta); cursor: pointer; padding: 7px 12px; border-radius: 999px;
        text-decoration: none; font: 700 13px var(--sans); white-space: nowrap; }

      .seg { pointer-events: auto; display: inline-flex; border-radius: 999px; padding: 3px; }
      .seg button { font: 700 13px var(--sans); color: var(--suave); background: none; border: 0; border-radius: 999px;
        padding: 6px 12px; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
      .seg button[aria-pressed="true"] { background: var(--tinta); color: #fff; }

      #lugares { display: flex; gap: 6px; margin: 8px -16px 0; padding: 2px 16px 8px; overflow-x: auto;
        scrollbar-width: none; pointer-events: auto; scroll-snap-type: x proximity;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 16px, #000 calc(100% - 28px), transparent);
                mask-image: linear-gradient(to right, transparent, #000 16px, #000 calc(100% - 28px), transparent); }
      #lugares::-webkit-scrollbar { display: none; }
      #lugares button { flex: none; scroll-snap-align: center; font: 700 13px var(--sans); color: var(--tinta); cursor: pointer;
        background: rgba(255, 251, 244, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, .7); border-radius: 999px; padding: 7px 13px;
        box-shadow: 0 3px 10px rgba(20, 30, 40, .12); transition: background .2s, color .2s, transform .12s; }
      #lugares button:active { transform: scale(.96); }
      #lugares button[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }

      /* ---------- aviso de llegada ---------- */
      #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 108px); z-index: 4; pointer-events: none;
        transform: translate(-50%, -10px); opacity: 0; padding: 9px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
        white-space: nowrap; transition: opacity .3s, transform .35s cubic-bezier(.2, .9, .3, 1.3); }
      #toast.visible { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- tarjeta del lugar ---------- */
      #ficha { position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 3;
        max-width: 420px; margin: 0 auto; padding: 14px 14px 12px; border-radius: 20px; overflow: hidden;
        background: rgba(255, 251, 244, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, .8); box-shadow: var(--sombra); pointer-events: none;
        transform: translateY(16px) scale(.98); opacity: 0; transition: opacity .3s, transform .4s cubic-bezier(.2, .8, .2, 1); }
      #ficha.visible { opacity: 1; transform: none; pointer-events: auto; }
      #ficha::before { content: ""; position: absolute; top: 7px; left: 50%; width: 36px; height: 4px; margin-left: -18px;
        border-radius: 4px; background: var(--linea); }
      .barra { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: transparent; }
      .barra i { display: block; height: 100%; width: 0; background: var(--acento); border-radius: 0 3px 3px 0; transition: width .25s linear; }

      .cab { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      #ficha-icono { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center;
        font-size: 20px; background: var(--acento-claro); }
      .cab .txt { min-width: 0; flex: 1; }
      #ficha-lugar { font: 700 16px/1.2 var(--serif); letter-spacing: -.01em; display: block;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #ficha-sub { color: var(--suave); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #ficha-badge { flex: none; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; color: #fff; }
      #plegar { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(42, 33, 26, .06);
        color: var(--suave); display: grid; place-items: center; cursor: pointer; padding: 0; }
      #plegar svg { transition: transform .3s; }
      #ficha.min #plegar svg { transform: rotate(180deg); }

      /* cuerpo plegable (animación de alto con grid) */
      .cuerpo { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s cubic-bezier(.2, .8, .2, 1); }
      .cuerpo > div { overflow: hidden; min-height: 0; }
      #ficha.min .cuerpo { grid-template-rows: 0fr; }
      #ficha.min { padding-bottom: 14px; }

      .contenido { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--linea); }
      .contenido.entra { animation: entra .45s cubic-bezier(.2, .8, .2, 1); }
      @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      #ficha-tag { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--acento); font-weight: 800; }
      #ficha-titulo { margin: 2px 0 4px; font: 600 18px/1.2 var(--serif); letter-spacing: -.01em; }
      #ficha-texto { margin: 0; color: #4a3f35; font-size: 14px; line-height: 1.45; }

      /* en pantallas anchas la tarjeta va al costado y deja libre el centro del mapa */
      @media (min-width: 760px) {
        #ficha, #guia { left: 16px; right: auto; width: 360px; margin: 0; bottom: 16px; }
      }

      .pie { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .izq { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      #ficha-puntos { display: flex; gap: 5px; }
      #ficha-puntos button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 8px; cursor: pointer;
        background: var(--linea); transition: width .25s, background .25s; }
      #ficha-puntos button[aria-current="true"] { width: 22px; background: var(--acento); }
      #ficha-num { font-size: 12px; color: var(--suave); white-space: nowrap; }
      .nav { display: flex; gap: 6px; flex: none; align-items: center; }
      .nav button { height: 34px; min-width: 34px; border-radius: 999px; border: 1px solid var(--linea); background: #fff;
        color: var(--tinta); font: 800 16px var(--sans); cursor: pointer; transition: transform .12s, background .2s; }
      .nav button:active { transform: scale(.94); }
      .nav .tour { font-size: 13px; padding: 0 14px; background: var(--acento-claro); border-color: transparent; color: #8a4512; }
      .nav .tour[aria-pressed="true"] { background: var(--acento); color: #fff; }

      /* ---------- guía del marcador ---------- */
      #guia { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 3;
        max-width: 420px; margin: 0 auto; display: none; gap: 14px; align-items: center; padding: 14px 16px;
        border-radius: 22px; background: var(--papel); box-shadow: var(--sombra); }
      #guia.visible { display: flex; animation: entra .4s cubic-bezier(.2, .8, .2, 1); }
      #guia img { width: 76px; height: 76px; border-radius: 10px; background: #fff; flex: none; border: 1px solid var(--linea); }
      #guia b { display: block; margin-bottom: 2px; font: 700 16px var(--serif); }
      #guia p { margin: 0 0 6px; font-size: 13px; color: var(--suave); }
      #guia a { color: var(--acento); font-size: 13px; font-weight: 800; }

      #aviso { position: fixed; right: 14px; bottom: 2px; z-index: 2; font-size: 10px; color: rgba(42, 33, 26, .45); pointer-events: none; }
      body.ra #aviso { color: rgba(255, 255, 255, .5); }

      /* ---------- celular en vertical: panel anclado abajo, botones grandes ---------- */
      @media (max-width: 600px) {
        #top { padding: calc(env(safe-area-inset-top) + 8px) 12px 0; }
        .largo { display: none; }
        .seg button { padding: 8px 14px; font-size: 14px; }
        .btn { padding: 8px 12px; font-size: 15px; }
        #lugares { margin: 8px -12px 0; padding: 2px 12px 6px; }
        #lugares button { padding: 8px 12px; font-size: 13px; }
        #estado { font-size: 12px; margin-top: 2px; }
        #toast { top: calc(env(safe-area-inset-top) + 100px); font-size: 13px; }

        #ficha, #guia { left: 0; right: 0; bottom: 0; max-width: none; margin: 0; border-radius: 20px 20px 0 0;
          border-bottom: 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 12px); }
        #ficha.min { padding-bottom: calc(env(safe-area-inset-bottom) + 14px); }
        #ficha-titulo { font-size: 17px; }
        .contenido { max-height: 30vh; overflow-y: auto; overscroll-behavior: contain; }
        .nav button { height: 42px; min-width: 42px; font-size: 18px; }
        .nav .tour { font-size: 14px; padding: 0 16px; }
        #ficha-puntos button { width: 10px; height: 10px; }
        #ficha-puntos button[aria-current="true"] { width: 26px; }
        #aviso { display: none; }
      }
      /* ---------- celular acostado: la tarjeta va al costado y no tapa el mapa ---------- */
      @media (max-height: 520px) and (orientation: landscape) {
        #ficha, #guia { left: 10px; right: auto; bottom: 10px; width: 330px; max-width: none; margin: 0; border-radius: 18px;
          padding: 12px 14px 10px; }
        .contenido { max-height: 32vh; overflow-y: auto; }
        #ficha-texto { font-size: 13px; }
        #toast { top: calc(env(safe-area-inset-top) + 96px); }
        #aviso { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="atmos"></div>
    <div id="top">
      <div class="fila">
        <div class="seg vidrio" role="group" aria-label="Modo de vista">
          <button type="button" data-m="3d">🧭 <span class="largo">Vista </span>3D</button>
          <button type="button" data-m="ra">📷 <span class="largo">Con marcador </span>Hiro</button>
        </div>
        <a class="btn vidrio" href="index.html" aria-label="Ver fauna">🐧<span class="largo"> Fauna</span></a>
      </div>
      <nav id="lugares" aria-label="Elegir lugar"></nav>
      <div id="estado" class="vidrio"><span class="dot"></span><span>Cargando…</span></div>
    </div>

    <div id="toast" class="vidrio" role="status"></div>

    <div id="ficha" aria-live="polite">
      <div class="barra"><i id="ficha-barra"></i></div>
      <div class="cab">
        <div id="ficha-icono" aria-hidden="true"></div>
        <div class="txt"><span id="ficha-lugar"></span><span id="ficha-sub"></span></div>
        <span id="ficha-badge"></span>
        <button type="button" id="plegar" aria-expanded="true" aria-label="Plegar tarjeta">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="cuerpo">
        <div>
          <div class="contenido" id="contenido">
            <div id="ficha-tag"></div>
            <h2 id="ficha-titulo"></h2>
            <p id="ficha-texto"></p>
          </div>
          <div class="pie">
            <div class="izq">
              <div id="ficha-puntos" aria-label="Datos del lugar"></div>
              <span id="ficha-num"></span>
            </div>
            <div class="nav">
              <button type="button" id="ant" aria-label="Lugar anterior">‹</button>
              <button type="button" id="tour" class="tour">▶ Recorrido</button>
              <button type="button" id="sig" aria-label="Lugar siguiente">›</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="guia">
      <img src="hiro.png" alt="Marcador Hiro" />
      <div>
        <b>Apunta al marcador Hiro</b>
        <p>La maqueta de Marcona aparecerá encima. Muéstralo en otra pantalla o imprímelo (8 cm de lado).</p>
        <a href="hiro.png" target="_blank" rel="noopener">Abrir marcador para imprimir ↗</a>
      </div>
    </div>
    <div id="aviso">Mapa ilustrativo, no a escala</div>
    <script>if (/[?&]verificar/.test(location.search)) document.write('<script src="verificar.js"><\/script>');</script>
    <script src="marcona.js"></script>
  </body>
</html>
